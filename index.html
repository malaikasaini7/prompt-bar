<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prompt bar - a generative-AI input study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <p class="kicker">interface study</p>
    <h1>The prompt bar is the product.</h1>
    <p class="lede">For a generative tool, the input field carries the whole first run experience.
    It should suggest, invite, and never feel empty.</p>

    <form class="prompt-bar" id="promptBar" autocomplete="off">
      <span class="spark" aria-hidden="true">✦</span>
      <div class="input-wrap">
        <input id="promptInput" type="text" aria-label="Prompt">
        <span class="ghost" id="ghost" aria-hidden="true"></span>
      </div>
      <button type="submit" class="send" aria-label="Generate">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="suggestions" id="suggestions" role="listbox" aria-label="Suggestions"></div>

    <p class="hint" id="hint">the placeholder types itself - click a suggestion or just start typing</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
